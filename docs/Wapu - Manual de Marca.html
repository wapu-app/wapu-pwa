document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fe0a340d-7115-4b04-b13d-fe20f1245e0b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Marca */\n  --pink: #e7357c;\n  --pink-hot: #f5179a;\n  --purple: #7309b6;\n  --blue: #504de7;\n  --volt: #f8f46b;\n  --mint: #7cffd8;\n\n  /* Neutros */\n  --ink: #0a0712;\n  --black: #020202;\n  --surface: #14121a;\n  --surface-2: #1d1a24;\n  --line: rgba(255, 255, 255, 0.10);\n  --line-strong: rgba(255, 255, 255, 0.18);\n  --fg: #f3f4f6;\n  --muted: #b6b4be;\n  --soft: #8a8892;\n\n  --outline: #0c1f14;\n\n  --maxw: 1180px;\n  --gutter: clamp(22px, 5vw, 72px);\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--ink);\n  color: var(--fg);\n  font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n}\n\n::selection { background: var(--volt); color: var(--black); }\n\nimg { max-width: 100%; display: block; }\n\n.mono {\n  font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n}\n\n/* ---------- Layout sheets ---------- */\n.sheet {\n  position: relative;\n  padding: clamp(56px, 9vh, 120px) var(--gutter);\n  border-bottom: 1px solid var(--line);\n  overflow: hidden;\n}\n.sheet-inner {\n  width: 100%;\n  max-width: var(--maxw);\n  margin: 0 auto;\n  position: relative;\n  z-index: 2;\n}\n\n.sheet-alt { background: var(--black); }\n\n/* Section index / eyebrow */\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  margin: 0 0 20px;\n  font-family: 'Geist Mono', monospace;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--volt);\n}\n.eyebrow::before {\n  content: \"\";\n  width: 26px;\n  height: 2px;\n  background: linear-gradient(90deg, var(--pink), var(--volt));\n}\n.eyebrow .num {\n  color: var(--soft);\n}\n\nh1, h2, h3, h4 {\n  margin: 0;\n  font-weight: 900;\n  letter-spacing: -0.03em;\n  line-height: 0.98;\n  text-wrap: balance;\n}\nh2 { font-size: clamp(34px, 5vw, 60px); }\nh3 { font-size: clamp(22px, 2.6vw, 30px); letter-spacing: -0.02em; }\n.lead {\n  max-width: 640px;\n  margin: 22px 0 0;\n  font-size: clamp(17px, 1.5vw, 20px);\n  line-height: 1.55;\n  color: var(--muted);\n}\n.section-head { margin-bottom: clamp(40px, 6vh, 68px); }\n\n.it { font-style: italic; color: var(--volt); }\n.pink { color: var(--pink-hot); }\n\n/* ============================================================\n   COVER\n   ============================================================ */\n.cover {\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  padding: clamp(32px, 5vh, 56px) var(--gutter) clamp(40px, 6vh, 64px);\n  background:\n    radial-gradient(1200px circle at 82% 12%, rgba(231, 53, 124, 0.28), transparent 42%),\n    radial-gradient(1000px circle at 8% 88%, rgba(80, 77, 231, 0.26), transparent 44%),\n    linear-gradient(160deg, #100a1c 0%, var(--ink) 46%, var(--black) 100%);\n}\n.cover-grid {\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);\n  background-size: 76px 76px;\n  mask-image: radial-gradient(circle at 60% 40%, #000, transparent 82%);\n  pointer-events: none;\n}\n.cover-top, .cover-mid, .cover-bottom { position: relative; z-index: 2; }\n.cover-top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 20px;\n}\n.cover-logo { width: clamp(120px, 16vw, 190px); height: auto; }\n.cover-chip {\n  font-family: 'Geist Mono', monospace;\n  font-size: 12px;\n  font-weight: 600;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--muted);\n  border: 1px solid var(--line-strong);\n  border-radius: 999px;\n  padding: 9px 16px;\n}\n.cover-mid { margin: auto 0; }\n.cover-kicker {\n  font-family: 'Geist Mono', monospace;\n  font-size: clamp(12px, 1.3vw, 14px);\n  font-weight: 600;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--volt);\n  margin: 0 0 22px;\n}\n.cover h1 {\n  font-size: clamp(60px, 13vw, 190px);\n  line-height: 0.86;\n  letter-spacing: -0.05em;\n}\n.cover h1 .sub {\n  display: block;\n  font-size: clamp(28px, 6vw, 86px);\n  color: var(--muted);\n  -webkit-text-fill-color: transparent;\n  background: linear-gradient(92deg, #fff, var(--muted));\n  -webkit-background-clip: text;\n  background-clip: text;\n  margin-top: 0.08em;\n}\n.cover-meta {\n  margin-top: clamp(34px, 6vh, 64px);\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px 40px;\n  font-family: 'Geist Mono', monospace;\n  font-size: 13px;\n  letter-spacing: 0.04em;\n  color: var(--soft);\n}\n.cover-meta b { color: var(--fg); font-weight: 600; }\n.cover-bottom {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 20px;\n  font-family: 'Geist Mono', monospace;\n  font-size: 12px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--soft);\n}\n\n/* ============================================================\n   TOC\n   ============================================================ */\n.toc-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n  gap: 0;\n  border-top: 1px solid var(--line);\n}\n.toc-item {\n  display: flex rgba(80,77,231,0.28) 1px, transparent 1px);\n  background-size: 30px 30px;\n}\n/* gradient demo */\n.demo-gradient { background: linear-gradient(120deg, var(--pink), var(--purple)); }\n/* bolt demo */\n.demo-bolt { background: var(--black); display: grid; place-items: center; }\n.demo-bolt svg { width: 78%; filter: drop-shadow(0 0 12px rgba(248,244,107,0.6)); }\n.bolt-core { fill: none; stroke: var(--volt); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;\n  stroke-dasharray: 300; animation: bolt 2.4s cubic-bezier(.4,.2,.2,1) infinite; }\n.bolt-glow { fill: none; stroke: rgba(124,255,216,0.4); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }\n@keyframes bolt { 0%{stroke-dashoffset:300} 55%{stroke-dashoffset:0} 100%{stroke-dashoffset:-300} }\n/* glow demo */\n.demo-glow { background: var(--black); display:grid; place-items:center; }\n.demo-glow .orb { width: 80px; height: 80px; border-radius: 50%; background: var(--pink);\n  box-shadow: 0 0 60px 10px rgba(231,53,124,0.7); animation: pulse 3s ease-in-out infinite; }\n@keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.12);opacity:1} }\n/* tape demo */\n.demo-tape { background: var(--surface-2); display:grid; place-items:center; }\n.demo-tape .tape {\n  width: 70%; height: 26px; transform: rotate(-5deg);\n  background: repeating-linear-gradient(45deg, rgba(248,244,107,0.85) 0 8px, rgba(248,244,107,0.55) 8px 16px);\n}\n/* sticker demo */\n.demo-sticker { background: var(--surface-2); display:grid; place-items:center; }\n.demo-sticker .st {\n  width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; text-align: center;\n  background: var(--volt); color: var(--outline); font-weight: 900; font-size: 12px; text-transform: uppercase;\n  transform: rotate(-10deg); box-shadow: inset 0 0 0 2px var(--outline); line-height: 1.1;\n}\n\n/* ============================================================\n   BUTTONS / UI\n   =========================== overflow: hidden;\n  background: var(--surface);\n}\n.img-card .ph { aspect-ratio: 4/3; overflow: hidden; position: relative; }\n.img-card .ph img { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.05) contrast(1.04); }\n.img-card .ph .tag {\n  position: absolute; top: 12px; left: 12px; z-index: 2;\n  background: var(--volt); color: var(--outline); font-family:'Geist Mono',monospace;\n  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 5px;\n  transform: rotate(-3deg);\n}\n.img-card .cap { padding: 14px 16px; font-size: 14px; color: var(--muted); }\n.img-card .cap b { color: var(--fg); display: block; font-size: 15px; margin-bottom: 3px; }\n\n.img-principles { margin-top: 26px; display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px; }\n.img-principles .p { border:1px solid var(--line); border-radius:12px; padding:18px 20px; background:var(--surface); }\n.img-principles .p .n { font-family:'Geist Mono',monospace; color:var(--mint); font-size:12px; letter-spacing:0.08em; }\n.img-principles .p p { margin:8px 0 0; font-size:14px; color:var(--muted); line-height:1.5; }\n\n/* ============================================================\n   APPLICATION (hero mock)\n   ============================================================ */\n.app-mock {\n  position: relative;\n  border: 1px solid var(--line);\n  border-radius: 22px;\n  overflow: hidden;\n  background:\n    radial-gradient(900px circle at 12% 8%, rgba(80,77,231,0.20), transparent 40%),\n    radial-gradient(900px circle at 92% 12%, rgba(231,53,124,0.22), transparent 42%),\n    var(--black);\n  padding: clamp(34px, 6vw, 72px) clamp(24px, 5vw, 60px);\n}\n.app-mock .grid {\n  position:absolute; inset:0;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);\n  background-size: 60px 60px; mask-image: radial-gradient(circle at 40% 40%, #000, transparent 78%);\n}\n.app-mock .content { position: relative; z-index: 2; max-width: 640px; }\n.app-mock .content .pill-demo { margin-bottom: 20px; }\n.app-mock h2 { font-size: clamp(34px, 6vw, 72px); }\n.app-mock .strike { position: relative; color: rgba(255,255,255,0.4); }\n.app-mock .strike::after { content:\"\"; position:absolute; left:-2%; right:-2%; top:52%; height:4px; background:var(--pink-hot); transform:rotate(-3deg); }\n.app-mock p { color: var(--muted); font-size: 18px; margin: 22px 0 30px; max-width: 520px; }\n\n/* ============================================================\n   CLOSE\n   ============================================================ */\n.close {\n  min-height: 62vh;\n  display: flex; flex-direction: column; justify-content: center;\n  background:\n    radial-gradient(800px circle at 80% 30%, rgba(231,53,124,0.18), transparent 50%),\n    radial-gradient(700px circle at 15% 80%, rgba(80,77,231,0.16), transparent 50%),\n    var(--black);\n}\n.close h2 { font-size: clamp(36px, 6vw, 78px); max-width: 900px; }\n.close .contacts {\n  margin-top: 40px; display: flex; flex-wrap: wrap; gap: 12px 36px;\n  font-family: 'Geist Mono', monospace; font-size: 14px; color: var(--muted); letter-spacing: 0.02em;\n}\n.close .contacts a { color: var(--mint); text-decoration: none; }\n.close .contacts a:hover { color: #fff; }\n.close .foot {\n  margin-top: clamp(48px, 8vh, 96px);\n  display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px;\n  font-family:'Geist Mono',monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--soft);\n  border-top: 1px solid var(--line); padding-top: 22px;\n}\n\n/* Progress bar */\n.progress {\n  position: fixed; top: 0; left: 0; height: 3px; width: 0%;\n  background: linear-gradient(90deg, var(--pink), var(--volt));\n  z-index: 100; box-shadow: 0 0 12px rgba(248,244,107,0.5);\n}\n\n/* Reveal */\n.r { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.2,.7,.25,1), transform .7s cubic-bezier(.2,.7,.25,1); }\n.r.in { opacity: 1; transform: none; }\n\na { color: var(--mint); }\na:hover { color: #fff; }\n\n/* ---------- Responsive ---------- */\n@media (max-width: 860px) {\n  .logo-showcase { grid-template-columns: 1fr; }\n  .saywhat { grid-template-columns: 1fr; }\n  .type-row { grid-template-columns: 1fr; gap: 10px; }\n  .type-row .label { order: -1; }\n}\n\n/* ---------- Print ---------- */\n@media print {\n  .progress { display: none; }\n  body { background: #fff; color: #111; }\n  .r { opacity: 1 !important; transform: none !important; }\n  .sheet, .cover { break-inside: avoid; page-break-inside: avoid; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n\n  <div class=\"progress\" id=\"progress\"><\u002Fdiv>\n\n  <!-- ============ COVER ============ -->\n  <header class=\"cover\" id=\"portada\">\n    <div class=\"cover-grid\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"cover-top\">\n      <img class=\"cover-logo\" src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"Wapu\">\n      <span class=\"cover-chip mono\">Argentina · 2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cover-mid\">\n      <p class=\"cover-kicker\">Guía de identidad visual<\u002Fp>\n      <h1>Manual<span class=\"sub\">de marca.<\u002Fspan><\u002Fh1>\n      <div class=\"cover-meta\">\n        <span><b>Producto<\u002Fb> · Bitcoin sin KYC<\u002Fspan>\n        <span><b>Mercado<\u002Fb> · Argentina / Latam<\u002Fspan>\n        <span><b>Versión<\u002Fb> · 1.0<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cover-bottom\">\n      <span>wapupay.com<\u002Fspan>\n      <span>Documento confidencial<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ TOC ============ -->\n  <section class=\"sheet sheet-alt\" id=\"indice\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow\"><span class=\"num\">00<\u002Fspan> Índice<\u002Fp>\n      <h2>Qué hay adentro.<\u002Fh2>\n      <p class=\"lead\">Todo lo que define cómo se ve, se lee y se siente Wapu. Usalo como fuente de verdad para producto, comunicación y campañas.<\u002Fp>\n\n      <nav class=\"toc-grid\" style=\"margin-top:44px;\">\n        <a class=\"toc-item\" href=\"#esencia\"><span class=\"n mono\">01<\u002Fspan><span class=\"t\">Esencia de marca<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#voz\"><span class=\"n mono\">02<\u002Fspan><span class=\"t\">Personalidad y tono<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#logo\"><span class=\"n mono\">03<\u002Fspan><span class=\"t\">Logotipo<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#logo-donts\"><span class=\"n mono\">04<\u002Fspan><span class=\"t\">Usos incorrectos<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#color\"><span class=\"n mono\">05<\u002Fspan><span class=\"t\">Color<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#tipografia\"><span class=\"n mono\">06<\u002Fspan><span class=\"t\">Tipografía<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#sistema\"><span class=\"n mono\">07<\u002Fspan><span class=\"t\">Sistema gráfico<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#ui\"><span class=\"n mono\">08<\u002Fspan><span class=\"t\">Componentes UI<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#fotografia\"><span class=\"n mono\">09<\u002Fspan><span class=\"t\">Fotografía<\u002Fspan><\u002Fa>\n        <a class=\"toc-item\" href=\"#aplicacion\"><span class=\"n mono\">10<\u002Fspan><span class=\"t\">Aplicación<\u002Fspan><\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 01 ESENCIA ============ -->\n  <section class=\"sheet\" id=\"esencia\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">01<\u002Fspan> Esencia de marca<\u002Fp>\n      <h2 class=\"r\">No necesitás pedir <span class=\"it\">permiso<\u002Fspan><br>para mover tu dinero.<\u002Fh2>\n      <p class=\"lead r\">Wapu es una experiencia P2P asistida para operar Bitcoin y stablecoins, y resolver pagos en Argentina sin convertir tu privacidad en un formulario. Menos fricción, reglas claras, control operativo.<\u002Fp>\n\n      <div class=\"voice-grid r\" style=\"margin-top:52px;\">\n        <div class=\"trait\">\n          <h4>Propósito<\u002Fh4>\n          <p>Que cualquiera pueda comprar, mover y usar Bitcoin sin KYC, con la simpleza de una app y la seguridad de un escrow real.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Promesa<\u002Fh4>\n          <p>Depositás cripto, elegís destino y Wapu coordina la contraparte por detrás. Vos hacés tres clicks.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Territorio<\u002Fh4>\n          <p>Argentina primero. Pensado para el contexto local: alias, CBU, CVU, MercadoPago y salida a pesos.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Creencia<\u002Fh4>\n          <p>La privacidad es un derecho, no un dato para juntar. Rebelde no es prometer magia: es hacer que el flujo funcione.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 VOZ ============ -->\n  <section class=\"sheet sheet-alt\" id=\"voz\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">02<\u002Fspan> Personalidad y tono<\u002Fp>\n      <h2 class=\"r\">Directos, honestos,<br>un poco <span class=\"it\">rebeldes<\u002Fspan>.<\u002Fh2>\n      <p class=\"lead r\">Hablamos como un argentino que sabe de cripto y no te vende humo. Claro antes que técnico, seguro antes que grandilocuente.<\u002Fp>\n\n      <div class=\"voice-grid r\" style=\"margin-top:48px;\">\n        <div class=\"trait\">\n          <h4>Rebelde<\u002Fh4>\n          <p>Cuestionamos el status quo del KYC y los intermediarios. Sin agresividad: con actitud.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Honesto<\u002Fh4>\n          <p>Sin promesa de magia. Explicamos cómo opera Wapu por debajo, con sus límites reales.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Simple<\u002Fh4>\n          <p>Frases cortas. Verbos de acción. Si una palabra técnica no suma, no va.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"trait\">\n          <h4>Local<\u002Fh4>\n          <p>Voseo argentino, modismos justos. Hablamos de guita, alias y pesos como en la calle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"saywhat r\">\n        <div class=\"col yes\">\n          <p class=\"ct mono\">Sí decimos<\u002Fp>\n          <ul class=\"yes\">\n            <li>\"Comprá, mové y usá Bitcoin sin KYC.\"<\u002Fli>\n            <li>\"Vos hacés tres clicks. Wapu coordina lo de atrás.\"<\u002Fli>\n            <li>\"No negociás con desconocidos.\"<\u002Fli>\n            <li>\"La privacidad es un derecho, no nos interesa juntar tus datos.\"<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"col no\">\n          <p class=\"ct mono\">No decimos<\u002Fp>\n          <ul class=\"no\">\n            <li>Promesas de rendimiento o \"hacete rico\".<\u002Fli>\n            <li>Jerga financiera vacía o siglas sin explicar.<\u002Fli>\n            <li>Tono corporativo, frío o de banco.<\u002Fli>\n            <li>Garantías absolutas de anonimato o legalidad.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 LOGO ============ -->\n  <section class=\"sheet\" id=\"logo\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">03<\u002Fspan> Logotipo<\u002Fp>\n      <h2 class=\"r\">El wordmark.<\u002Fh2>\n      <p class=\"lead r\">Un logotipo redondeado y compacto, con contorno marcado y la <span class=\"pink\">u<\u002Fspan> en magenta como firma de color. Transmite cercanía, actitud y solidez.<\u002Fp>\n\n      <div class=\"logo-showcase r\" style=\"margin-top:48px;\">\n        <div class=\"logo-stage\">\n          <img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"Wapu logo sobre fondo oscuro\">\n        <\u002Fdiv>\n        <div class=\"logo-stage on-light\">\n          <img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"Wapu logo sobre fondo claro\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"logo-showcase r\" style=\"grid-template-columns:1fr 1fr;\">\n        <div class=\"logo-clearspace\">\n          <div class=\"box\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"Área de protección del logo\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"logo-rules\">\n          <div class=\"rule-card\">\n            <span class=\"rt mono\">Área de protección<\u002Fspan>\n            <h4>Aire igual a la \"u\"<\u002Fh4>\n            <p>Dejá como mínimo el ancho de la letra \"u\" de aire libre alrededor del logo. Nada invade esa zona.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rule-card\">\n            <span class=\"rt mono\">Tamaño mínimo<\u002Fspan>\n            <h4>96 px / 25 mm<\u002Fh4>\n            <p>Por debajo de ese ancho el contorno pierde legibilidad. Para favicon usar solo el isotipo \"u\".<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rule-card\">\n            <span class=\"rt mono\">Fondos<\u002Fspan>\n            <h4>Contraste primero<\u002Fh4>\n            <p>Preferido sobre fondos oscuros o claros sólidos. Sobre fotos, usar detrás una capa de contraste.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rule-card\">\n            <span class=\"rt mono\">Versión reducida<\u002Fspan>\n            <h4>Isotipo \"u\"<\u002Fh4>\n            <p>La \"u\" magenta funciona como marca corta en avatares, app icon y espacios muy chicos.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 DON'TS ============ -->\n  <section class=\"sheet sheet-alt\" id=\"logo-donts\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">04<\u002Fspan> Usos incorrectos<\u002Fp>\n      <h2 class=\"r\">Lo que <span class=\"pink\">no<\u002Fspan> se hace.<\u002Fh2>\n      <p class=\"lead r\">La consistencia del logo es innegociable. Estos son los errores más comunes: evitalos siempre.<\u002Fp>\n\n      <div class=\"dont-grid r\">\n        <div class=\"dont\">\n          <div class=\"frame d-stretch\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"\"><\u002Fdiv>\n          <div class=\"cap\">No deformar ni estirar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <div class=\"frame d-rotate\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"\"><\u002Fdiv>\n          <div class=\"cap\">No rotar ni inclinar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <div class=\"frame d-recolor\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"\"><\u002Fdiv>\n          <div class=\"cap\">No recolorear el wordmark.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <div class=\"frame d-shadow\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"\"><\u002Fdiv>\n          <div class=\"cap\">No agregar sombras ni efectos.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"dont\">\n          <div class=\"frame d-color\"><img src=\"9102d77e-197d-41b5-9461-c0a3b15519f6\" alt=\"\"><\u002Fdiv>\n          <div class=\"cap\">No usar sobre fondos de bajo contraste.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 COLOR ============ -->\n  <section class=\"sheet\" id=\"color\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">05<\u002Fspan> Color<\u002Fp>\n      <h2 class=\"r\">Paleta.<\u002Fh2>\n      <p class=\"lead r\">Un fondo casi negro que deja respirar a los acentos eléctricos. El rosa es la firma; el degradé rosa→púrpura           <span class=\"pill-demo mono\"><span class=\"dot\"><\u002Fspan>P2P asistido · Argentina · Sin KYC<\u002Fspan>\n          <h2>Transferí pesos usando tus BTC o USDT, sin <span class=\"strike\">KYC<\u002Fspan>.<\u002Fh2>\n          <p>Depositá cripto, elegí destino y Wapu se encarga del resto: escrow, contrapartes confiables y liquidación a pesos.<\u002Fp>\n          <a class=\"btn btn-primary\" href=\"#aplicacion\">Entrar a Wapu →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ CLOSE ============ -->\n  <section class=\"sheet close\" id=\"cierre\">\n    <div class=\"sheet-inner\">\n      <p class=\"eyebrow r\"><span class=\"num\">→<\u002Fspan> Cierre<\u002Fp>\n      <h2 class=\"r\">Rebelde no es prometer magia.<br>Es hacer que el flujo <span class=\"it\">funcione<\u002Fspan>.<\u002Fh2>\n\n      <div class=\"contacts r\">\n        <span>Web · <a href=\"https://wapupay.com\">wapupay.com<\u002Fa><\u002Fspan>\n        <span>Instagram · <a href=\"https://www.instagram.com/wapu.app/\">@wapu.app<\u002Fa><\u002Fspan>\n        <span>X · <a href=\"https://twitter.com/wapupay\">@wapupay<\u002Fa><\u002Fspan>\n        <span>LinkedIn · <a href=\"https://www.linkedin.com/company/wapupay/\">WapuPay<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"foot\">\n        <span>Wapu · Manual de marca v1.0<\u002Fspan>\n        <span>Argentina · 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <script>\n    // Progress bar\n    const progress = document.getElementById('progress');\n    const onScroll = () => {\n      const h = document.documentElement;\n      const max = h.scrollHeight - h.clientHeight;\n      progress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';\n    };\n    addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n\n    // Reveal (IO + scroll fallback so fast jumps / print never leave content hidden)\n    const targets = Array.from(document.querySelectorAll('.r'));\n    targets.forEach((el, i) => { el.style.transitionDelay = (Math.min(i % 6, 5) * 40) + 'ms'; });\n    const revealInView = () => {\n      const trigger = innerHeight * 0.94;\n      targets.forEach((el) => {\n        if (el.classList.contains('in')) return;\n        const r = el.getBoundingClientRect();\n        if (r.top < trigger && r.bottom > -40) el.classList.add('in');\n      });\n    };\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });\n      targets.forEach((el) => io.observe(el));\n    } else {\n      targets.forEach((el) => el.classList.add('in'));\n    }\n    let revealScheduled = false;\n    const scheduleReveal = () => {\n      if (revealScheduled) return;\n      revealScheduled = true;\n      requestAnimationFrame(() => { revealScheduled = false; revealInView(); });\n    };\n    addEventListener('scroll', scheduleReveal, { passive: true });\n    addEventListener('resize', scheduleReveal, { passive: true });\n    revealInView();\n    requestAnimationFrame(revealInView);\n    setTimeout(revealInView, 120);\n    setTimeout(revealInView, 400);\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
