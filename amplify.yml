version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install
        - npm ci
    build:
      commands:
        - |
          echo "Selecting frontend environment for AWS_BRANCH=${AWS_BRANCH:-unknown}"
          case "${AWS_BRANCH:-}" in
            staging)
              npm run env:stg
              ;;
            main|prod|production)
              npm run env:prod
              ;;
            qa|develop)
              npm run env:qa
              ;;
            *)
              echo "Unknown AWS_BRANCH='${AWS_BRANCH:-}'. Falling back to qa environment."
              npm run env:qa
              ;;
          esac
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
